<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pinnacle Global School ERP</title>
    <!-- Use logo.jpg as favicon -->
    <link rel="icon" type="image/jpg" href="logo.jpg">
    <style>
        :root { --primary: #003366; --accent: #f39c12; }
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; }
        nav { background: var(--primary); padding: 15px; display: flex; align-items: center; color: white; }
        nav img { height: 60px; margin-right: 20px; }
        .menu-btn { background: none; border: 1px solid white; color: white; padding: 8px 15px; cursor: pointer; margin-right: 10px; }
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 10px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .submit-btn { background: var(--accent); color: white; border: none; width: 100%; padding: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<nav>
    <img src="logo.jpg" alt="Pinnacle Logo">
    <h2>Pinnacle Global School Portal</h2>
    <div style="margin-left:auto">
        <button class="menu-btn" onclick="show('dash')">Dashboard</button>
        <button class="menu-btn" onclick="show('entry')">Data Entry</button>
        <button class="menu-btn" onclick="show('edit')">Edit Data</button>
    </div>
</nav>

<div class="container">
    <div id="entry" class="section">
        <div class="card">
            <h3>Student Registration</h3>
            <form id="regForm">
                <input type="text" name="regFormNum" placeholder="Registration Form Number" required>
                <input type="text" name="studentName" placeholder="Student Name" required>
                <input type="text" name="motherName" placeholder="Mother Name">
                <input type="text" name="fatherName" placeholder="Father Name">
                <select name="address" id="addrDrop"><option>Loading addresses...</option></select>
                <select name="caste">
                    <option>General</option><option>OBC</option><option>SC</option><option>ST</option>
                </select>
                <select name="gender">
                    <option>Male</option><option>Female</option><option>Other</option>
                </select>
                <input type="text" name="dob" placeholder="Date of Birth (DD/MM/YYYY)">
                <input type="text" name="aadhaar" placeholder="Aadhaar Number">
                <input type="text" name="prevSchool" placeholder="Previous School">
                <input type="text" name="phone" placeholder="Phone Number">
                <input type="text" name="dateAdmission" placeholder="Date of Admission (DD/MM/YYYY)">
                <select name="classAdmission">
                    <option>Nursery</option><option>LKG</option><option>UKG</option>
                    <option>1st</option><option>2nd</option><option>3rd</option>
                    <option>4th</option><option>5th</option><option>6th</option>
                    <option>7th</option><option>8th</option><option>9th</option>
                    <option>10th</option><option>11th</option><option>12th</option>
                </select>
                <input type="number" name="regFee" placeholder="Registration Fee Amount Paid">
                <button type="button" class="submit-btn" onclick="submitData()">SUBMIT TO GOOGLE SHEETS</button>
            </form>
        </div>
    </div>
    
    <div id="dash" class="section" style="display:none">
        <div class="card"><h3>Dashboard</h3><p>Live updates from sheets will appear here.</p></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwY9qAIz67ON33MPAOMoEfe6O2O5LHJR9-N5-2RrefqhHq8SsckPBrPBLGiGHQUFvxETA/exec";

    function show(id) {
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    // Load Addresses on Startup
    async function loadConfig() {
        const resp = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({action: 'getAddresses'})
        });
        const list = await resp.json();
        const drop = document.getElementById('addrDrop');
        drop.innerHTML = list.map(a => `<option>${a}</option>`).join('');
    }

    async function submitData() {
        const form = document.getElementById('regForm');
        const formData = Object.fromEntries(new FormData(form).entries());
        
        const resp = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({action: 'submit', data: formData})
        });
        
        if (resp.ok) {
            alert("Student Data Successfully Entered!");
            form.reset();
        }
    }

    loadConfig();
</script>
</body>
</html>
