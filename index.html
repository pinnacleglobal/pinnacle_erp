<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinnacle Global School - ERP Portal</title>
    <!-- Styles omitted for brevity, keep your existing CSS here -->
    <style>
        /* Keep all your original CSS here */
        :root { --navy: #1a3a8f; --gold: #b45309; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8fafc; }
        /* ... (Include your full CSS block from the original file) ... */
    </style>
</head>
<body>

<div class="app-container">
  <nav class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">PGS</div>
      <p class="sidebar-school-name">Tradition | Innovation | Excellence</p>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">Main Menu</div>
      <div class="nav-item active" onclick="showPage('dashboard',this)">Dashboard</div>
      <div class="nav-item" onclick="showPage('entry',this)">Student Data Entry</div>
      <div class="nav-item" onclick="showPage('edit',this)">Edit Student Records</div>
    </div>
  </nav>

  <main class="main">
    <!-- DASHBOARD -->
    <div id="page-dashboard" class="page active">
      <!-- Your existing Dashboard HTML -->
    </div>

    <!-- STUDENT ENTRY -->
    <div id="page-entry" class="page">
      <div class="page-header">
        <h2>New Student Admission</h2>
      </div>
      <div class="admission-banner" id="admBanner">
        <div id="admNumber"></div>
      </div>
      <div class="card">
        <div class="form-grid">
            <div class="form-group"><label>Reg Form No <span class="req">*</span></label><input type="text" id="f_regNo"></div>
            <div class="form-group"><label>Student Name <span class="req">*</span></label><input type="text" id="f_name"></div>
            <div class="form-group"><label>Mother Name <span class="req">*</span></label><input type="text" id="f_mother"></div>
            <div class="form-group"><label>Father Name <span class="req">*</span></label><input type="text" id="f_father"></div>
            <div class="form-group"><label>Address <span class="req">*</span></label><select id="f_address"></select></div>
            <div class="form-group"><label>Caste <span class="req">*</span></label><select id="f_caste"><option>General</option><option>OBC</option><option>SC</option><option>ST</option></select></div>
            <div class="form-group"><label>Gender <span class="req">*</span></label><select id="f_gender"><option>Male</option><option>Female</option></select></div>
            <div class="form-group"><label>DOB <span class="req">*</span></label><input type="text" id="f_dob" placeholder="DD/MM/YYYY"></div>
            <div class="form-group"><label>Aadhaar</label><input type="text" id="f_aadhaar"></div>
            <div class="form-group"><label>Prev School</label><input type="text" id="f_prevSchool"></div>
            <div class="form-group"><label>Phone <span class="req">*</span></label><input type="text" id="f_phone"></div>
            <div class="form-group"><label>Date of Admission <span class="req">*</span></label><input type="text" id="f_doa" placeholder="DD/MM/YYYY"></div>
            <div class="form-group"><label>Class <span class="req">*</span></label><select id="f_class"><option>Nursery</option><option>1st</option><!-- etc --></select></div>
            <div class="form-group"><label>Fee Paid</label><input type="number" id="f_fee"></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="submitBtn" onclick="submitEntry()">Submit & Register</button>
        </div>
      </div>
    </div>

    <!-- EDIT PAGE -->
    <div id="page-edit" class="page">
        <!-- Your existing Edit HTML -->
    </div>
  </main>
</div>

<script>
// CONFIG - UPDATE THESE
const S1_ID = "1OGjVUEvD-vWJ73vANmjbNFezvXplhkTS5sSx3jDE5cI";
const S1_AW_GID = "0";
const S1_MK_GID = "1915083603"; 
const S2_ID = "1-GLk792iA3SHeH26JalYGcu0w_ESVvQyhkGvkWe6r3U";
const S2_TRIAL_GID = "1048925622";
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfwqQHQMonqpF3VKqZyuZ2V34riEX9W0iFB--gKwerIbufJeWu5bWPC9-XEOUULk9NZA/exec";

// ... (Keep your fetchCSV, parseCSV, toast, and date helper functions) ...

async function submitEntry() {
  const get = id => document.getElementById(id);
  const data = {
    regNo: get("f_regNo").value,
    studentName: get("f_name").value,
    motherName: get("f_mother").value,
    fatherName: get("f_father").value,
    address: get("f_address").value,
    caste: get("f_caste").value,
    gender: get("f_gender").value,
    dob: get("f_dob").value,
    aadhaar: get("f_aadhaar").value,
    prevSchool: get("f_prevSchool").value,
    phone: get("f_phone").value,
    doa: get("f_doa").value,
    cls: get("f_class").value,
    fee: get("f_fee").value
  };

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerText = "Processing...";

  try {
    const response = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "addStudent", data: data })
    });
    const res = await response.json();
    if (res.success) {
      toast("Success! Adm No: " + res.admissionNumber);
      get("admNumber").innerText = res.admissionNumber;
      get("admBanner").classList.add("show");
    } else {
      toast("Error: " + res.error, "error");
    }
  } catch (e) {
    toast("Connection Error", "error");
  } finally {
    btn.disabled = false;
    btn.innerText = "Submit & Register";
  }
}

// ... (Keep your loadDashboard and loadEditTable functions) ...
</script>
</body>
</html>
