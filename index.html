<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinnacle Global School - ERP Portal</title>
<!-- Favicon Link -->
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root {
    --navy: #1a3a8f; --gold: #b45309; --gold-light: #fef3c7;
    --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
    --gray-400: #94a3b8; --gray-700: #334155; --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; color: var(--gray-700); }
  
  .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  .header { text-align: center; margin-bottom: 2rem; }
  .logo { width: 120px; height: auto; margin-bottom: 1rem; }
  .school-title { color: var(--navy); font-size: 1.8rem; font-weight: 800; }
  
  .card { background: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 2rem; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
  .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
  input, select { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-200); border-radius: 0.5rem; font-size: 0.95rem; outline: none; }
  input:focus { border-color: var(--navy); ring: 2px solid var(--navy); }
  
  .btn { width: 100%; padding: 1rem; border-radius: 0.5rem; font-weight: 700; cursor: pointer; border: none; font-size: 1rem; transition: 0.3s; }
  .btn-primary { background: var(--navy); color: white; margin-top: 2rem; }
  .btn-primary:hover { background: #112a6b; }
  .btn-primary:disabled { background: var(--gray-400); }

  .admission-banner { display: none; background: #ecfdf5; border: 2px solid #10b981; padding: 1.5rem; border-radius: 0.5rem; margin-bottom: 2rem; text-align: center; }
  .admission-banner.show { display: block; animation: fadeIn 0.5s; }
  .adm-no-box { font-size: 2rem; font-weight: 900; color: #065f46; margin-top: 0.5rem; }

  .toast { position: fixed; top: 2rem; right: 2rem; padding: 1rem 2rem; border-radius: 0.5rem; color: white; display: none; font-weight: 600; }
  .toast.show { display: block; }
  .toast.success { background: #10b981; }
  .toast.error { background: #ef4444; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .req { color: #ef4444; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <img src="logo.png" alt="PGS Logo" class="logo">
    <div class="school-title">Pinnacle Global School</div>
    <p>Tradition | Innovation | Excellence</p>
  </div>

  <div class="admission-banner" id="admBanner">
    <p>Student Registered Successfully!</p>
    <div class="adm-no-box" id="admNumber">---</div>
  </div>

  <div class="card">
    <h3 style="margin-bottom: 1.5rem; color: var(--navy); border-bottom: 2px solid var(--gray-50); padding-bottom: 0.5rem;">New Admission Form</h3>
    <div class="form-grid">
      <div class="form-group"><label>Reg Form No <span class="req">*</span></label><input type="text" id="f_regNo"></div>
      <div class="form-group"><label>Student Name <span class="req">*</span></label><input type="text" id="f_name"></div>
      <div class="form-group"><label>Mother's Name <span class="req">*</span></label><input type="text" id="f_mother"></div>
      <div class="form-group"><label>Father's Name <span class="req">*</span></label><input type="text" id="f_father"></div>
      <div class="form-group"><label>Address <span class="req">*</span></label><select id="f_address"><option value="">Loading...</option></select></div>
      <div class="form-group"><label>Caste <span class="req">*</span></label>
        <select id="f_caste">
          <option>General</option><option>OBC</option><option>SC</option><option>ST</option>
        </select>
      </div>
      <div class="form-group"><label>Gender <span class="req">*</span></label>
        <select id="f_gender">
          <option>Male</option><option>Female</option>
        </select>
      </div>
      <div class="form-group"><label>Date of Birth <span class="req">*</span></label><input type="text" id="f_dob" placeholder="DD/MM/YYYY"></div>
      <div class="form-group"><label>Aadhaar Number</label><input type="text" id="f_aadhaar" maxlength="12"></div>
      <div class="form-group"><label>Phone Number <span class="req">*</span></label><input type="text" id="f_phone" maxlength="10"></div>
      <div class="form-group"><label>Date of Admission <span class="req">*</span></label><input type="text" id="f_doa" placeholder="DD/MM/YYYY"></div>
      <div class="form-group"><label>Class <span class="req">*</span></label>
        <select id="f_class">
          <option>Nursery</option><option>LKG</option><option>UKG</option>
          <option>1st</option><option>2nd</option><option>3rd</option><option>4th</option>
          <option>5th</option><option>6th</option><option>7th</option><option>8th</option>
          <option>9th</option><option>10th</option><option>11th</option><option>12th</option>
        </select>
      </div>
      <div class="form-group"><label>Registration Fee Paid</label><input type="number" id="f_fee"></div>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitEntry()">Submit & Register Student</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const S1_ID = "1OGjVUEvD-vWJ73vANmjbNFezvXplhkTS5sSx3jDE5cI";
const S1_MK_GID = "1915083603";
const APPS_SCRIPT_URL = "REPLACE_WITH_YOUR_DEPLOYED_WEB_APP_URL";

async function fetchCSV(sheetId, gid) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
  const res = await fetch(url);
  const text = await res.text();
  return text.split('\n').map(row => row.split(',').map(c => c.replace(/^"(.*)"$/, '$1')));
}

function toast(msg, type="success") {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = `toast show ${type}`;
  setTimeout(() => t.className = "toast", 4000);
}

async function loadAddressDropdown() {
  try {
    const rows = await fetchCSV(S1_ID, S1_MK_GID);
    const sel = document.getElementById("f_address");
    const addresses = rows.slice(3, 54).map(r => r[24]).filter(a => a && a.trim());
    sel.innerHTML = '<option value="">Select Address</option>' + 
      addresses.map(a => `<option value="${a}">${a}</option>`).join('');
  } catch(e) { document.getElementById("f_address").innerHTML = '<option value="">Error loading</option>'; }
}

async function submitEntry() {
  const get = id => document.getElementById(id).value.trim();
  const fields = {
    regNo: get("f_regNo"), studentName: get("f_name"), motherName: get("f_mother"),
    fatherName: get("f_father"), address: get("f_address"), caste: get("f_caste"),
    gender: get("f_gender"), dob: get("f_dob"), aadhaar: get("f_aadhaar"),
    phone: get("f_phone"), doa: get("f_doa"), cls: get("f_class"), fee: get("f_fee")
  };

  if(!fields.studentName || !fields.phone || !fields.regNo) return toast("Please fill required fields", "error");

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Writing to Google Sheets...";

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "addStudent", data: fields })
    });
    const result = await res.json();
    if(result.success) {
      document.getElementById("admNumber").textContent = result.admissionNumber;
      document.getElementById("admBanner").classList.add("show");
      toast("Registered Successfully");
      clearForm();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else { toast("Error: " + result.error, "error"); }
  } catch(e) { toast("Connection error. Check URL.", "error"); }
  finally { btn.disabled = false; btn.textContent = "Submit & Register Student"; }
}

function clearForm() {
  document.querySelectorAll('input').forEach(i => i.value = "");
  document.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
}

document.addEventListener("DOMContentLoaded", loadAddressDropdown);
</script>
</body>
</html>
