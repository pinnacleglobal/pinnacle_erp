<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinnacle Global School - ERP Portal</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root {
    --navy: #1a3a8f; --gold: #b45309; --gray-50: #f8fafc; --gray-200: #e2e8f0; --gray-700: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: var(--gray-700); padding: 2rem 1rem; }
  .container { max-width: 850px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 2rem; }
  .logo { width: 100px; margin-bottom: 1rem; }
  .school-title { color: var(--navy); font-size: 1.8rem; font-weight: 800; }
  .card { background: white; border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 2rem; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
  input, select { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-200); border-radius: 0.5rem; font-size: 0.95rem; }
  .btn { width: 100%; padding: 1rem; border-radius: 0.5rem; font-weight: 700; cursor: pointer; border: none; font-size: 1rem; transition: 0.3s; margin-top: 2rem; }
  .btn-primary { background: var(--navy); color: white; }
  .admission-banner { display: none; background: #ecfdf5; border: 2px solid #10b981; padding: 1.5rem; border-radius: 0.5rem; margin-bottom: 2rem; text-align: center; }
  .admission-banner.show { display: block; }
  .adm-no-box { font-size: 2rem; font-weight: 900; color: #065f46; }
  .toast { position: fixed; top: 1rem; right: 1rem; padding: 1rem; border-radius: 0.5rem; color: white; display: none; z-index: 100; }
  .toast.show { display: block; }
  .req { color: #ef4444; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <img src="logo.png" alt="Logo" class="logo">
    <div class="school-title">Pinnacle Global School</div>
    <p>Data Entry Portal</p>
  </div>

  <div class="admission-banner" id="admBanner">
    <p>Registration Successful!</p>
    <div class="adm-no-box" id="admNumber">---</div>
  </div>

  <div class="card">
    <div class="form-grid">
      <div class="form-group"><label>Reg Form No <span class="req">*</span></label><input type="text" id="f_regNo"></div>
      <div class="form-group"><label>Student Name <span class="req">*</span></label><input type="text" id="f_name"></div>
      <div class="form-group"><label>Mother's Name <span class="req">*</span></label><input type="text" id="f_mother"></div>
      <div class="form-group"><label>Father's Name <span class="req">*</span></label><input type="text" id="f_father"></div>
      <!-- ADDRESS IS NOW OPTIONAL (No * Red Asterisk) -->
      <div class="form-group"><label>Address (Optional)</label><select id="f_address"><option value="">Select Address</option></select></div>
      <div class="form-group"><label>Caste <span class="req">*</span></label><select id="f_caste"><option>General</option><option>OBC</option><option>SC</option><option>ST</option></select></div>
      <div class="form-group"><label>Gender <span class="req">*</span></label><select id="f_gender"><option>Male</option><option>Female</option></select></div>
      <div class="form-group"><label>Date of Birth <span class="req">*</span></label><input type="text" id="f_dob" placeholder="DD/MM/YYYY"></div>
      <div class="form-group"><label>Aadhaar Number</label><input type="text" id="f_aadhaar" maxlength="12"></div>
      <div class="form-group"><label>Phone Number <span class="req">*</span></label><input type="text" id="f_phone" maxlength="10"></div>
      <div class="form-group"><label>Date of Admission <span class="req">*</span></label><input type="text" id="f_doa" placeholder="DD/MM/YYYY"></div>
      <div class="form-group"><label>Class <span class="req">*</span></label><select id="f_class"><option>Nursery</option><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option><option>5th</option></select></div>
      <div class="form-group"><label>Fee Paid</label><input type="number" id="f_fee"></div>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitEntry()">Register Student</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const S1_ID = "1OGjVUEvD-vWJ73vANmjbNFezvXplhkTS5sSx3jDE5cI";
const S1_MK_GID = "1915083603";
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwS3HLeMilt7qFZGH7rOoNIe5Q4bKOc5_CSRVPgOvBNXUC1xoWRGSjyHuT3obpVIVB1Ew/exec";

async function loadAddresses() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${S1_ID}/export?format=csv&gid=${S1_MK_GID}`;
    const res = await fetch(url);
    const text = await res.text();
    const rows = text.split('\n').map(r => r.split(','));
    const sel = document.getElementById("f_address");
    const options = rows.slice(3, 54).map(r => r[24]).filter(a => a && a.trim());
    sel.innerHTML += options.map(a => `<option value="${a.replace(/"/g,'')}">${a.replace(/"/g,'')}</option>`).join('');
  } catch(e) { console.log("Address load failed"); }
}

async function submitEntry() {
  const get = id => document.getElementById(id).value.trim();
  const data = {
    regNo: get("f_regNo"), studentName: get("f_name"), motherName: get("f_mother"),
    fatherName: get("f_father"), address: get("f_address"), caste: get("f_caste"),
    gender: get("f_gender"), dob: get("f_dob"), aadhaar: get("f_aadhaar"),
    phone: get("f_phone"), doa: get("f_doa"), cls: get("f_class"), fee: get("f_fee")
  };

  // Validation (Address is excluded here)
  if(!data.regNo || !data.studentName || !data.phone) {
    return showToast("Please fill all required fields (*)", "red");
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Processing...";

  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "addStudent", data }) });
    const result = await res.json();
    if(result.success) {
      document.getElementById("admNumber").textContent = result.admissionNumber;
      document.getElementById("admBanner").classList.add("show");
      showToast("Data Saved Successfully!", "#10b981");
      clearForm();
      window.scrollTo(0,0);
    } else { showToast("Error: " + result.error, "red"); }
  } catch(e) { showToast("Network Error", "red"); }
  finally { btn.disabled = false; btn.textContent = "Register Student"; }
}

function showToast(m, c) {
  const t = document.getElementById("toast");
  t.textContent = m; t.style.background = c; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 4000);
}

function clearForm() {
  document.querySelectorAll('input').forEach(i => i.value = "");
  document.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
}

document.addEventListener("DOMContentLoaded", loadAddresses);
</script>
</body>
</html>
