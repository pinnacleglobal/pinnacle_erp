<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinnacle Global School - Syllabus & Date Sheet</title>
    
    <!-- Favicon -->
    <link rel="icon" href="logo.png" type="image/png">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- html2canvas Library for Image Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --top-dark-blue: #093c85;
            --class-blue: #007bff;
            --gold-banner: #dca327;
            --table-header-blue: #0c3978;
            --row-alt-blue: #edf4ff;
            --border-color: #d1dbe8;
            --section-header-bg: #3f4448;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f2f4f8;
            color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        /* Controls Section */
        .controls-container {
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 450px;
        }

        .view-toggle {
            display: flex;
            width: 100%;
            background: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .view-toggle button {
            flex: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            font-weight: 700;
            font-size: 13px;
            color: #0c3978;
            cursor: pointer;
            transition: 0.2s;
        }

        .view-toggle button.active {
            background: #0c3978;
            color: #fff;
        }

        .controls-container label {
            font-weight: 700;
            color: #0c3978;
            font-size: 14px;
        }

        .controls-container select {
            padding: 6px 10px;
            border: 1.5px solid #007bff;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            background: #fff;
            color: #0c3978;
        }

        .btn-download {
            background-color: #0c3978;
            color: #ffffff;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-download:active {
            opacity: 0.8;
        }

        /* Main Card Layout */
        .card-wrapper {
            width: 100%;
            max-width: 450px;
        }

        .display-card {
            background: #ffffff;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        /* Header Blue Banner */
        .header-bg {
            background-color: var(--top-dark-blue);
            padding: 20px 15px 15px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bg img.logo {
            width: 120px;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        /* Class Pill Box */
        .class-pill {
            background-color: var(--class-blue);
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            width: 100%;
            padding: 10px 0;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Main Body Padding */
        .card-content {
            padding: 12px;
        }

        /* Gold Banner */
        .gold-banner {
            background-color: var(--gold-banner);
            color: #000000;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        /* Table Design */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            table-layout: fixed;
        }

        .data-table th {
            background-color: var(--table-header-blue);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 10px;
            text-align: center;
            border: 1px solid var(--table-header-blue);
        }

        .data-table th.col-left {
            width: 32%;
        }

        .data-table th.col-right {
            width: 68%;
        }

        .data-table td {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            vertical-align: middle;
            line-height: 1.35;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .col-left-td {
            font-weight: 700;
            color: #111111;
            text-align: center;
        }

        .col-right-td {
            color: #222222;
            text-align: center; /* Center aligned for datesheet subject, left for syllabus */
        }

        .syllabus-mode .col-right-td {
            text-align: left;
            white-space: pre-wrap;
        }

        .data-table tr:nth-child(odd) td {
            background-color: #ffffff;
        }

        .data-table tr:nth-child(even) td {
            background-color: var(--row-alt-blue);
        }

        /* Minor/Major Header Rows */
        .data-table tr.section-header-row td {
            background-color: var(--section-header-bg) !important;
            color: #ffffff;
            font-weight: 700;
            text-align: center;
            font-size: 13.5px;
            letter-spacing: 0.5px;
            padding: 6px 10px;
            border: 1px solid var(--section-header-bg);
        }
    </style>
</head>
<body>

    <!-- User Controls -->
    <div class="controls-container">
        <div class="view-toggle">
            <button id="btnTabDatesheet" class="active" onclick="switchMode('datesheet')">Date Sheet</button>
            <button id="btnTabSyllabus" onclick="switchMode('syllabus')">Syllabus</button>
        </div>

        <div>
            <label for="classSelect">Class: </label>
            <select id="classSelect" onchange="renderCard()">
                <option value="">-- Loading... --</option>
            </select>
        </div>

        <button class="btn-download" onclick="downloadImage()">
            Download Image
        </button>
    </div>

    <!-- Printable / Download Area -->
    <div class="card-wrapper">
        <div class="display-card" id="cardContainer">
            
            <!-- Dark Blue Top Bar with Logo & Class -->
            <div class="header-bg">
                <img src="logo.png" alt="Pinnacle Global School Logo" class="logo" onerror="this.src='https://via.placeholder.com/120?text=PGS+LOGO'">
                <div class="class-pill" id="selectedClassLabel">Class : ---</div>
            </div>

            <!-- Content Area -->
            <div class="card-content" id="cardContent">
                <!-- Gold Banner -->
                <div class="gold-banner" id="bannerLabel">Loading...</div>

                <!-- Main Table -->
                <table class="data-table" id="dataTable">
                    <thead>
                        <tr>
                            <th class="col-left" id="thCol1">Date</th>
                            <th class="col-right" id="thCol2">Subject</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="2" style="text-align: center; padding: 20px; color: #666;">
                                Loading data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

   <script>
    // Sheet Details
    const SHEET_ID = '1Sy5uBZkjKpGnLdZp2sFuhFORhO1fRqCswfNYHRl73PM';
    const SHEET_NAME = encodeURIComponent('DS n Notice');
    const GID = '1383668039';
    
    // Explicitly ask for the specific tab name and gid
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&gid=${GID}`;

    let currentMode = 'datesheet';
    let rawRows = [];
    let examName = "Examination";
    let sessionYear = "";

    let parsedSyllabusData = {};
    let parsedDatesheetData = {};

    async function fetchSheetData() {
        try {
            const response = await fetch(SHEET_URL);
            const text = await response.text();

            // Check if sheet returned Google login HTML (permissions issue)
            if (text.includes("<!DOCTYPE") || text.includes("<html")) {
                throw new Error("Spreadsheet is not public. Please set 'General access' to 'Anyone with the link can view' in Google Sheets.");
            }

            const jsonStart = text.indexOf("{");
            const jsonEnd = text.lastIndexOf("}");
            if (jsonStart === -1 || jsonEnd === -1) {
                throw new Error("Invalid response format received from Google Sheets.");
            }

            const jsonString = text.substring(jsonStart, jsonEnd + 1);
            const data = JSON.parse(jsonString);

            if (!data.table || !data.table.rows) {
                throw new Error("No table rows found in Google Sheet response.");
            }

            rawRows = data.table.rows;
            console.log(`Loaded ${rawRows.length} rows successfully.`);

            extractHeaderMetadata();
            parseDateSheet();
            parseSyllabus();
            populateDropdown();
        } catch (error) {
            console.error("Error loading spreadsheet data:", error);
            document.getElementById('tableBody').innerHTML = `
                <tr><td colspan="2" style="color:red; text-align:center; padding: 15px;">
                    <b>Error:</b> ${error.message}
                </td></tr>
            `;
            document.getElementById('classSelect').innerHTML = '<option value="">No Classes Found</option>';
        }
    }

    // Safely retrieve formatted text (.f) or raw value (.v) from any cell
    function getCellVal(r, c) {
        if (rawRows[r] && rawRows[r].c && rawRows[r].c[c]) {
            const cell = rawRows[r].c[c];
            if (cell.f !== null && cell.f !== undefined) return String(cell.f).trim();
            if (cell.v !== null && cell.v !== undefined) return String(cell.v).trim();
        }
        return "";
    }

    function normalizeClassName(str) {
        return str.replace(/^CLASS[\s-:]*/i, '').trim();
    }

    // Extract Exam Name (B1 / cell [0,1]) and Session (F1 / cell [0,5])
    function extractHeaderMetadata() {
        const b1 = getCellVal(0, 1);
        if (b1) examName = b1;

        const f1 = getCellVal(0, 5);
        if (f1) sessionYear = f1;
    }

    // Parse Datesheet: searches row 1..3 for class headers (Nursery, LKG, etc.)
    function parseDateSheet() {
        parsedDatesheetData = {};

        // Auto-detect class header row around row 2 (indices 0 to 4)
        let headerRowIdx = -1;
        for (let r = 0; r <= 3; r++) {
            for (let c = 1; c <= 15; c++) {
                const val = getCellVal(r, c).toLowerCase();
                if (val.includes("nur") || val.includes("1st") || val.includes("6th")) {
                    headerRowIdx = r;
                    break;
                }
            }
            if (headerRowIdx !== -1) break;
        }

        if (headerRowIdx === -1) headerRowIdx = 1; // fallback to row index 1 (Sheet row 2)

        const classCols = {};
        for (let c = 1; c <= 15; c++) {
            let clsName = getCellVal(headerRowIdx, c);
            if (clsName) {
                clsName = normalizeClassName(clsName);
                classCols[c] = clsName;
                if (!parsedDatesheetData[clsName]) {
                    parsedDatesheetData[clsName] = { minor: [], major: [] };
                }
            }
        }

        // Minor Exams: Row indices 3 & 4 (Rows 4 & 5)
        for (let r = 3; r <= 4; r++) {
            const date = getCellVal(r, 0);
            if (!date) continue;
            for (let c in classCols) {
                const cls = classCols[c];
                const subject = getCellVal(r, parseInt(c));
                if (subject) {
                    parsedDatesheetData[cls].minor.push({ date, subject });
                }
            }
        }

        // Major Exams: Row indices 6 to 11 (Rows 7 to 12)
        for (let r = 6; r <= 11; r++) {
            const date = getCellVal(r, 0);
            if (!date) continue;
            for (let c in classCols) {
                const cls = classCols[c];
                const subject = getCellVal(r, parseInt(c));
                if (subject) {
                    parsedDatesheetData[cls].major.push({ date, subject });
                }
            }
        }
    }

    // Parse Syllabus: Finds Nursery block and 6th block dynamically
    function parseSyllabus() {
        parsedSyllabusData = {};

        let nurseryRowIdx = -1;
        let sixthRowIdx = -1;

        // Scan rows 30 to 80 for where the Class headers actually start
        for (let r = 30; r < rawRows.length; r++) {
            for (let c = 0; c < 16; c++) {
                const val = getCellVal(r, c).toLowerCase();
                if (nurseryRowIdx === -1 && (val.includes("nursery") || val === "nur")) {
                    nurseryRowIdx = r;
                }
                if (sixthRowIdx === -1 && (val.includes("6th") || val === "vi")) {
                    sixthRowIdx = r;
                }
            }
        }

        // Fallbacks if not auto-detected: Row 51 is index 50, Row 67 is index 66
        if (nurseryRowIdx === -1) nurseryRowIdx = 50;
        if (sixthRowIdx === -1) sixthRowIdx = 66;

        // Block 1: Nursery to 5th (Data starts 2 rows below header, ends right before 6th block)
        const b1End = sixthRowIdx > nurseryRowIdx ? sixthRowIdx - 1 : nurseryRowIdx + 15;
        parseSyllabusBlock(nurseryRowIdx, nurseryRowIdx + 2, b1End, 16);

        // Block 2: 6th to 12th
        parseSyllabusBlock(sixthRowIdx, sixthRowIdx + 2, Math.min(sixthRowIdx + 16, rawRows.length - 1), 14);
    }

    function parseSyllabusBlock(classHeaderRowIdx, startRowIdx, endRowIdx, maxColIndex) {
        if (!rawRows[classHeaderRowIdx]) return;

        for (let c = 0; c < maxColIndex; c += 2) {
            let className = getCellVal(classHeaderRowIdx, c + 1) || getCellVal(classHeaderRowIdx, c);
            if (!className) continue;
            className = normalizeClassName(className);

            if (!parsedSyllabusData[className]) {
                parsedSyllabusData[className] = [];
            }

            for (let r = startRowIdx; r <= endRowIdx; r++) {
                const subject = getCellVal(r, c);
                const syllabus = getCellVal(r, c + 1);
                const subLower = subject.toLowerCase();

                if (
                    (subject !== "" || syllabus !== "") &&
                    !subLower.startsWith("class") &&
                    !subLower.startsWith("subject") &&
                    !subLower.startsWith("syllabus")
                ) {
                    parsedSyllabusData[className].push({ subject, syllabus });
                }
            }
        }
    }

    function populateDropdown() {
        const select = document.getElementById('classSelect');
        const previousVal = select.value;
        select.innerHTML = '';

        const dataSource = currentMode === 'datesheet' ? parsedDatesheetData : parsedSyllabusData;
        const classes = Object.keys(dataSource);

        if (classes.length === 0) {
            select.innerHTML = '<option value="">No Classes Found</option>';
            renderCard();
            return;
        }

        classes.forEach((cls) => {
            const opt = document.createElement('option');
            opt.value = cls;
            opt.innerText = `Class ${cls}`;
            select.appendChild(opt);
        });

        if (previousVal && classes.includes(previousVal)) {
            select.value = previousVal;
        } else {
            select.selectedIndex = 0;
        }

        renderCard();
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('btnTabDatesheet').className = mode === 'datesheet' ? 'active' : '';
        document.getElementById('btnTabSyllabus').className = mode === 'syllabus' ? 'active' : '';

        const content = document.getElementById('cardContent');
        if (mode === 'syllabus') {
            content.classList.add('syllabus-mode');
        } else {
            content.classList.remove('syllabus-mode');
        }

        populateDropdown();
    }

    function renderCard() {
        const selectedClass = document.getElementById('classSelect').value;
        const tbody = document.getElementById('tableBody');
        const thCol1 = document.getElementById('thCol1');
        const thCol2 = document.getElementById('thCol2');
        const banner = document.getElementById('bannerLabel');

        document.getElementById('selectedClassLabel').innerText = `Class : ${selectedClass || '---'}`;
        tbody.innerHTML = '';

        if (!selectedClass) {
            tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding: 15px;">No class selected.</td></tr>`;
            return;
        }

        if (currentMode === 'datesheet') {
            thCol1.innerText = "Date";
            thCol2.innerText = "Subject";
            banner.innerText = `Date Sheet: ${examName}`;

            const data = parsedDatesheetData[selectedClass] || { minor: [], major: [] };
            const isMajorMinorApplicable = /half\s*yearly|annual/i.test(examName);

            if (data.minor.length === 0 && data.major.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding: 15px;">No date sheet available for Class ${selectedClass}.</td></tr>`;
                return;
            }

            if (isMajorMinorApplicable) {
                if (data.minor.length > 0) {
                    tbody.innerHTML += `<tr class="section-header-row"><td colspan="2">MINOR EXAMS</td></tr>`;
                    data.minor.forEach(item => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="col-left-td">${item.date}</td>
                                <td class="col-right-td">${item.subject}</td>
                            </tr>
                        `;
                    });
                }

                if (data.major.length > 0) {
                    tbody.innerHTML += `<tr class="section-header-row"><td colspan="2">MAJOR EXAMS</td></tr>`;
                    data.major.forEach(item => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="col-left-td">${item.date}</td>
                                <td class="col-right-td">${item.subject}</td>
                            </tr>
                        `;
                    });
                }
            } else {
                const combined = [...data.minor, ...data.major];
                combined.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="col-left-td">${item.date}</td>
                            <td class="col-right-td">${item.subject}</td>
                        </tr>
                    `;
                });
            }

        } else {
            thCol1.innerText = "Subject";
            thCol2.innerText = "Syllabus";
            banner.innerText = `Syllabus: ${examName}`;

            const items = parsedSyllabusData[selectedClass] || [];

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding: 15px;">No syllabus details entered for Class ${selectedClass}.</td></tr>`;
                return;
            }

            items.forEach(item => {
                let formattedSyllabus = item.syllabus
                    .split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(line => line.startsWith('•') || line.startsWith('-') ? line : `• ${line}`)
                    .join('\n');

                tbody.innerHTML += `
                    <tr>
                        <td class="col-left-td">${item.subject || '---'}</td>
                        <td class="col-right-td">${formattedSyllabus}</td>
                    </tr>
                `;
            });
        }
    }

    function downloadImage() {
        const container = document.getElementById('cardContainer');
        const selectedClass = document.getElementById('classSelect').value;
        const prefix = currentMode === 'datesheet' ? 'DateSheet' : 'Syllabus';

        html2canvas(container, {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff"
        }).then(canvas => {
            const imageURI = canvas.toDataURL("image/png");
            const link = document.createElement("a");
            link.download = `${prefix}_Class_${selectedClass}.png`;
            link.href = imageURI;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }).catch(err => {
            console.error("Image export failed:", err);
            alert("Could not generate image. Please try again.");
        });
    }

    window.addEventListener('DOMContentLoaded', fetchSheetData);
</script>
