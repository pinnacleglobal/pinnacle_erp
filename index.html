<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinnacle Global School - ERP Portal</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0d2156; --gold: #c9a227; --gold-light: #f0c84a;
            --blue: #1a3a8f; --blue-light: #2451b3; --cream: #fdf8ee;
            --white: #ffffff; --gray-50: #f8f9fc; --gray-100: #eef0f7;
            --gray-200: #d5d9e8; --gray-400: #8891b0; --gray-600: #4a5380;
            --gray-800: #1e2444; --success: #1a7a4a; --danger: #b91c1c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Source Sans 3", sans-serif; background: var(--gray-50); color: var(--gray-800); }

        .header { 
            background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%); 
            color: white; padding: 0 2rem; display: flex; align-items: center; 
            gap: 1.5rem; height: 80px; position: fixed; width: 100%; top: 0; z-index: 100; 
        }

        .header-logo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--gold); }
        .header-title h1 { font-family: "Playfair Display", serif; font-size: 1.4rem; }
        .header-title p { font-size: 0.75rem; color: var(--gold-light); text-transform: uppercase; }

        .layout { display: flex; margin-top: 80px; min-height: calc(100vh - 80px); }

        .sidebar { 
            width: 260px; background: var(--navy); color: white; padding: 1.5rem 0; 
            position: fixed; top: 80px; bottom: 0; border-right: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-branding { text-align: center; padding-bottom: 1.5rem; border-bottom: 1px solid rgba(201,162,39,0.2); margin-bottom: 1rem; }
        .sidebar-logo { width: 70px; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 10px; }

        .nav-item { 
            display: flex; align-items: center; padding: 1rem 1.5rem; cursor: pointer; 
            font-size: 0.95rem; color: rgba(255,255,255,0.7); transition: 0.2s; 
        }
        .nav-item:hover, .nav-item.active { background: rgba(201,162,39,0.15); color: var(--gold-light); border-left: 4px solid var(--gold); }

        .main { margin-left: 260px; flex: 1; padding: 2.5rem; }
        .page { display: none; }
        .page.active { display: block; }

        .card { background: white; border-radius: 12px; border: 1px solid var(--gray-200); padding: 2rem; margin-bottom: 2rem; }
        .card-title { font-family: "Playfair Display", serif; font-size: 1.3rem; color: var(--navy); margin-bottom: 1.5rem; display: block; border-bottom: 1px solid var(--gray-100); padding-bottom: 0.5rem; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; border-radius: 12px; border: 1px solid var(--gray-200); padding: 1.5rem; text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--navy); display: block; }
        .stat-label { font-size: 0.8rem; color: var(--gray-400); text-transform: uppercase; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .full-width { grid-column: span 2; }
        
        label { font-size: 0.85rem; font-weight: 600; color: var(--gray-600); }
        input, select { padding: 0.8rem; border: 1.5px solid var(--gray-200); border-radius: 8px; outline: none; }
        input:focus { border-color: var(--blue); }

        .btn { padding: 0.8rem 2rem; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: var(--navy); color: white; }
        
        .table-wrapper { overflow-x: auto; margin-top: 1rem; border-radius: 8px; border: 1px solid var(--gray-200); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: var(--gray-50); padding: 1rem; text-align: left; font-size: 0.8rem; color: var(--gray-600); border-bottom: 2px solid var(--gray-200); }
        td { padding: 1rem; border-bottom: 1px solid var(--gray-100); font-size: 0.9rem; }

        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 2rem; border-radius: 8px; color: white; display: none; z-index: 1000; }
        .show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<header class="header">
    <img src="logo.png" alt="Logo" class="header-logo">
    <div class="header-title">
        <h1>Pinnacle Global School</h1>
        <p>Tradition | Innovation | Excellence</p>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-branding">
            <img src="logo.png" alt="Logo" class="sidebar-logo">
        </div>
        <div class="nav-item active" onclick="showPage('dashboard',this)">Dashboard</div>
        <div class="nav-item" onclick="showPage('entry',this)">Data Entry</div>
        <div class="nav-item" onclick="showPage('edit',this)">Edit Records</div>
    </aside>

    <main class="main">
        <div id="page-dashboard" class="page active">
            <div class="stats-grid">
                <div class="stat-card"><span class="stat-label">Total</span><span class="stat-value" id="statTotal">0</span></div>
                <div class="stat-card"><span class="stat-label">Month</span><span class="stat-value" id="statMonth">0</span></div>
                <div class="stat-card"><span class="stat-label">Fees</span><span class="stat-value" id="statFees">0</span></div>
                <div class="stat-card"><span class="stat-label">Today</span><span class="stat-value" id="statToday">0</span></div>
            </div>
            <div class="card">
                <span class="card-title">Recent Admissions</span>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Adm No</th><th>Student Name</th><th>Father</th><th>Class</th><th>Date</th></tr></thead>
                        <tbody id="dashBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="page-entry" class="page">
            <div class="card">
                <span class="card-title">Student Registration Form</span>
                <div class="admission-banner" id="admBanner" style="display:none; background:var(--cream); padding:1rem; border:1px solid var(--gold); border-radius:8px; margin-bottom:1rem; color:var(--navy);">
                    Registration Successful! Admission No: <strong id="admNumber"></strong>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label>Reg Form No*</label><input type="text" id="f_regNo"></div>
                    <div class="form-group"><label>Student Name*</label><input type="text" id="f_name"></div>
                    <div class="form-group"><label>Mother's Name*</label><input type="text" id="f_mother"></div>
                    <div class="form-group"><label>Father's Name*</label><input type="text" id="f_father"></div>
                    <div class="form-group"><label>Class*</label><select id="f_class">
                        <option value="">Select</option><option>Nursery</option><option>LKG</option><option>UKG</option>
                        <option>1st</option><option>2nd</option><option>3rd</option><option>4th</option>
                        <option>5th</option><option>6th</option><option>7th</option><option>8th</option>
                        <option>9th</option><option>10th</option><option>11th</option><option>12th</option>
                    </select></div>
                    <div class="form-group"><label>DOB*</label><input type="text" id="f_dob" placeholder="DD/MM/YYYY"></div>
                    <div class="form-group"><label>Phone*</label><input type="tel" id="f_phone" maxlength="10"></div>
                    <div class="form-group"><label>Admission Date*</label><input type="text" id="f_doa" placeholder="DD/MM/YYYY"></div>
                    <div class="form-group"><label>Caste*</label><select id="f_caste"><option>General</option><option>OBC</option><option>SC</option><option>ST</option></select></div>
                    <div class="form-group"><label>Gender*</label><select id="f_gender"><option>Male</option><option>Female</option></select></div>
                    <div class="form-group"><label>Aadhaar</label><input type="text" id="f_aadhaar" maxlength="12"></div>
                    <div class="form-group"><label>Fee (₹)</label><input type="number" id="f_fee"></div>
                    <div class="form-group full-width"><label>Address*</label><select id="f_address"><option value="">Loading...</option></select></div>
                </div>
                <div style="margin-top:2rem;"><button class="btn btn-primary" id="submitBtn" onclick="submitEntry()">Submit Admission</button></div>
            </div>
        </div>

        <div id="page-edit" class="page">
            <div class="card"><span class="card-title">Master Register</span><div id="editWrap" class="table-wrapper"></div></div>
        </div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtde4ywK0BKRDrFzIEkqW_-vTnrND77h6GVwHK0pohRxWMGkjwmyouvdaSQwK7lZmAsw/exec";
    const S1_ID = "1OGjVUEvD-vWJ73vANmjbNFezvXplhkTS5sSx3jDE5cI";
    const S1_AW_GID = "0";
    const S1_MK_GID = "1915083603";

    function toast(msg, type="success") {
        const t = document.getElementById("toast");
        t.textContent = msg; t.style.background = type === "success" ? "#1a7a4a" : "#b91c1c";
        t.className = "toast show"; setTimeout(() => t.className = "toast", 3000);
    }

    async function fetchCSV(id, gid) {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`);
        const text = await res.text();
        return text.split("\n").map(row => row.split(",").map(cell => cell.replace(/^"|"$/g, '')));
    }

    function showPage(name, el) {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
        document.getElementById("page-"+name).classList.add("active");
        el.classList.add("active");
    }

    async function loadAddressDropdown() {
        const rows = await fetchCSV(S1_ID, S1_MK_GID);
        const addresses = rows.slice(3, 54).map(r => r[24]).filter(a => a);
        document.getElementById("f_address").innerHTML = '<option value="">Select Address</option>' + 
            addresses.map(a => `<option value="${a}">${a}</option>`).join("");
    }

    async function loadDashboard() {
        const rows = await fetchCSV(S1_ID, S1_AW_GID);
        const data = rows.slice(1).filter(r => r[1]);
        document.getElementById("statTotal").textContent = data.length;
        document.getElementById("dashBody").innerHTML = data.slice(-5).reverse().map(r => 
            `<tr><td>${r[1]}</td><td>${r[3]}</td><td>${r[6]}</td><td>${r[4]}</td><td>${r[2]}</td></tr>`).join("");
    }

    async function submitEntry() {
        const data = {
            regNo: document.getElementById("f_regNo").value,
            name: document.getElementById("f_name").value,
            mother: document.getElementById("f_mother").value,
            father: document.getElementById("f_father").value,
            address: document.getElementById("f_address").value,
            cls: document.getElementById("f_class").value,
            dob: document.getElementById("f_dob").value,
            phone: document.getElementById("f_phone").value,
            doa: document.getElementById("f_doa").value,
            caste: document.getElementById("f_caste").value,
            gender: document.getElementById("f_gender").value,
            aadhaar: document.getElementById("f_aadhaar").value,
            fee: document.getElementById("f_fee").value
        };

        if (!data.name || !data.doa) return toast("Name and Date are required", "error");

        const btn = document.getElementById("submitBtn");
        btn.disabled = true; btn.textContent = "Processing...";

        try {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "addStudent", data })
            });
            const result = await res.json();
            if (result.success) {
                document.getElementById("admNumber").textContent = result.admissionNumber;
                document.getElementById("admBanner").style.display = "block";
                toast("Admission Successful");
                loadDashboard();
            }
        } catch(e) { toast("Error: " + e.message, "error"); }
        btn.disabled = false; btn.textContent = "Submit Admission";
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadAddressDropdown();
        loadDashboard();
    });
</script>
</body>
</html>
